name: Build VST2 DLL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build VST2 DLL
        shell: cmd
        run: build_vst2.bat nopause

      - name: Package DLL
        shell: pwsh
        run: |
          if (-not (Test-Path "AutoPitchPro.dll")) {
            throw "Build did not produce AutoPitchPro.dll"
          }
          Compress-Archive -Path "AutoPitchPro.dll" -DestinationPath "AutoPitchPro-win64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: AutoPitchPro-win64
          path: AutoPitchPro-win64.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Auto-Pitch Pro VST2 build ${{ github.run_number }}
          files: AutoPitchPro-win64.zip
